name = "s3-proxy"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# 所有配置都在 Cloudflare 面板里设置：Workers & Pages → s3-proxy → Settings → Variables and Secrets
# keep_vars = true：部署时不覆盖、不删除面板里设置的变量
keep_vars = true

# 建议绑定自定义域名（*.workers.dev 实测也能缓存，但部分地区访问不稳定）
# 可以在面板 Settings → Domains & Routes 里加，也可以在这里写：
# routes = [{ pattern = "cdn.example.com", custom_domain = true }]

# ---------------- 面板变量一览 ----------------
# 必填
#   S3_ENDPOINT           Text    S3 接口地址，如 https://s3.example.com（必须是域名）
#   S3_BUCKET             Text    桶名
# 私有桶必填（公开读的桶两个都不填，Worker 不签名直接读）
#   S3_ACCESS_KEY_ID      Secret  访问密钥 ID
#   S3_SECRET_ACCESS_KEY  Secret  访问密钥
# 可选（括号内为默认值）
#   ALLOWED_PREFIXES      Text    ()           只允许访问这些前缀，逗号分隔，如 uploads/  （URL 不变）
#   S3_REGION             Text    (us-east-1)  R2 填 auto
#   PATH_STYLE            Text    (true)       true: endpoint/bucket/key  false: bucket.endpoint/key
#   PATH_PREFIX           Text    ()           只暴露桶内某个目录，如 public/
#   CACHE_TTL             Text    (86400)      边缘缓存秒数，0 = 不缓存
#   BROWSER_TTL           Text    (3600)       浏览器缓存秒数，0 = no-store
#   CACHE_MAX_BYTES       Text    (104857600)  超过此大小不进缓存
#   WARM_ON_RANGE         Text    (true)       分段请求未命中时后台拉整个文件进缓存
#   CORS_ORIGINS          Text    (*)          逗号分隔的允许来源
#   DEBUG                 Text    (false)      true 时把源站错误打到日志
#   KEEP_CONTENT_DISPOSITION Text (false)   true 时保留对象的 Content-Disposition（attachment 会让浏览器下载而不是显示）
#   ACCESS_TOKEN          Secret  ()           访问口令：?token=xxx 或 Authorization: Bearer xxx
#   SIGN_SECRET           Secret  ()           限时签名链接密钥
# ACCESS_TOKEN 和 SIGN_SECRET 都不设 = 公开访问
